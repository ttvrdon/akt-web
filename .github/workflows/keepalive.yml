name: Azure Function Keep-Alive

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:
permissions: {}  # least privileges

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random Delay and Ping
        run: |
          # Generates random number between 0 and 30 seconds
          DELAY=$(( RANDOM % 31 ))
          echo "Waiting for $DELAY seconds to look natural..."
          sleep $DELAY
          
          curl -s -o /dev/null -w "Status code: %{http_code}\n" https://akt-zs.cz/api/keepAlive
